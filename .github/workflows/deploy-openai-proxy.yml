name: Deploy OpenAI Proxy (GCP)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - gcp/openai-proxy/**
      - .github/workflows/deploy-openai-proxy.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: situationroom-ai-20260112
      REGION: us-central1
      SERVICE_NAME: situation-room-openai
      ALLOWED_ORIGINS: https://congressionalinsights.github.io,http://localhost:5173
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Ensure OpenAI secret
        env:
          OPEN_AI: ${{ secrets.OPEN_AI }}
        run: |
          if [ -z "$OPEN_AI" ]; then
            echo "OPEN_AI secret missing."
            exit 1
          fi
          if ! gcloud secrets describe openai-api-key --project "$PROJECT_ID" >/dev/null 2>&1; then
            gcloud secrets create openai-api-key --replication-policy=automatic
          fi
          echo -n "$OPEN_AI" | gcloud secrets versions add openai-api-key --data-file=-
      - name: Deploy OpenAI proxy service
        run: |
          cat > /tmp/sr-openai-env.yaml <<EOF
          ALLOWED_ORIGINS: "${ALLOWED_ORIGINS}"
          EOF
          gcloud run deploy "$SERVICE_NAME" \
            --region "$REGION" \
            --source gcp/openai-proxy \
            --allow-unauthenticated \
            --set-secrets OPENAI_API_KEY=openai-api-key:latest \
            --env-vars-file /tmp/sr-openai-env.yaml
      - name: Health check OpenAI proxy
        run: |
          set -euo pipefail
          SERVICE_URL=$(gcloud run services describe "$SERVICE_NAME" --region "$REGION" --format='value(status.url)')
          curl -fsS "${SERVICE_URL}/health" >/dev/null

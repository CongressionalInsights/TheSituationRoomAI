name: Deploy OpenAI Proxy (GCP)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - gcp/openai-proxy/**
      - .github/workflows/deploy-openai-proxy.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: situationroom-ai-20260112
      REGION: us-central1
      SERVICE_NAME: situation-room-openai
      ALLOWED_ORIGINS: https://congressionalinsights.github.io,http://localhost:5173
      SR_BRIEFING_MODEL: ${{ vars.SR_BRIEFING_MODEL || 'gpt-6.1-terra' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Require existing OpenAI secret
        run: |
          set -euo pipefail
          gcloud secrets describe openai-api-key --project "$PROJECT_ID" >/dev/null
          if [ "$(gcloud secrets versions describe latest --secret openai-api-key --project "$PROJECT_ID" --format='value(state)')" != "ENABLED" ]; then
            echo "Existing OpenAI secret binding unavailable." >&2
            exit 1
          fi
      - name: Deploy OpenAI proxy service
        run: |
          node -e 'require("node:fs").writeFileSync("/tmp/sr-openai-env.yaml", JSON.stringify({ ALLOWED_ORIGINS: process.env.ALLOWED_ORIGINS, SR_BRIEFING_MODEL: process.env.SR_BRIEFING_MODEL }))'
          gcloud run deploy "$SERVICE_NAME" \
            --region "$REGION" \
            --source gcp/openai-proxy \
            --allow-unauthenticated \
            --set-secrets OPENAI_API_KEY=openai-api-key:latest \
            --env-vars-file /tmp/sr-openai-env.yaml
      - name: Health check OpenAI proxy
        run: |
          set -euo pipefail
          SERVICE_URL=$(gcloud run services describe "$SERVICE_NAME" --region "$REGION" --format='value(status.url)')
          curl -fsS "${SERVICE_URL}/health" >/dev/null

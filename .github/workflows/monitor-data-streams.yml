name: Monitor Data Streams

on:
  workflow_dispatch:
  schedule:
    - cron: '15 12 * * *'

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Run full data-stream audit
        run: |
          node analysis/monitor/run_full_audit.mjs \
            --base https://situation-room-feed-382918878290.us-central1.run.app \
            --mcp https://situation-room-mcp-382918878290.us-central1.run.app/mcp \
            --static https://congressionalinsights.github.io/TheSituationRoomAI \
            --allow-alerts
      - name: Upload monitor artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: data-monitor-${{ github.run_id }}
          path: |
            analysis/monitor/latest.json
            analysis/monitor/latest.md
            analysis/monitor/history
            analysis/monitor/doc-watch.json
          if-no-files-found: warn

name: Deploy MCP Proxy (GCP)

on:
  workflow_dispatch:
    inputs:
      sync_secret_versions:
        description: Sync configured GitHub secrets into Secret Manager before deploying
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - gcp/mcp-proxy/**
      - .github/workflows/deploy-mcp-proxy.yml
  pull_request:
    branches: [main]
    paths:
      - gcp/mcp-proxy/**
      - .github/workflows/deploy-mcp-proxy.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Sync feed registry
        run: node scripts/sync-feeds.mjs
      - name: Verify MCP deploy source files
        run: |
          set -euo pipefail
          required_files=(
            "gcp/mcp-proxy/server.js"
            "gcp/mcp-proxy/state-signals.js"
            "gcp/mcp-proxy/feeds.json"
            "gcp/mcp-proxy/package.json"
            "gcp/mcp-proxy/package-lock.json"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing required deploy source file: $file"
              exit 1
            fi
          done

          find gcp/mcp-proxy -maxdepth 2 -type f | sort
      - name: Dependency preflight
        run: npm ci --prefix gcp/mcp-proxy
      - name: Syntax preflight
        run: |
          set -euo pipefail
          node --check gcp/mcp-proxy/server.js
          node --check gcp/mcp-proxy/state-signals.js
          node --check gcp/mcp-proxy/public-payload-safety.js

  deploy:
    if: github.event_name != 'pull_request'
    needs: preflight
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-mcp-proxy
      cancel-in-progress: false
    env:
      PROJECT_ID: situationroom-ai-20260112
      REGION: us-central1
      SERVICE_NAME: situation-room-mcp
      ALLOWED_ORIGINS: https://congressionalinsights.github.io,http://localhost:5173
      ACLED_PROXY: https://situation-room-acled-382918878290.us-central1.run.app/api/acled
      STATE_CONNECTOR_BASE_URL: ${{ secrets.STATE_CONNECTOR_BASE_URL }}
      STATE_CONNECTOR_KEY_HEADER: ${{ secrets.STATE_CONNECTOR_KEY_HEADER }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Sync feed registry
        run: node scripts/sync-feeds.mjs
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Ensure MCP proxy secrets
        if: github.event_name == 'workflow_dispatch' && inputs.sync_secret_versions
        env:
          DATA_GOV: ${{ secrets.DATA_GOV }}
          EIA: ${{ secrets.EIA }}
          NASA_FIRMS: ${{ secrets.NASA_FIRMS }}
          OPEN_AQ: ${{ secrets.OPEN_AQ }}
          OPENSTATES: ${{ secrets.OPENSTATES }}
          EARTHDATA_NASA: ${{ secrets.EARTHDATA_NASA }}
          OPENSKY_CLIENTID: ${{ secrets.OPENSKY_CLIENTID }}
          OPENSKY_CLIENTSECRET: ${{ secrets.OPENSKY_CLIENTSECRET }}
          SAMGOV_API_KEY: ${{ secrets.SAMGOV_API_KEY }}
          STATE_CONNECTOR_API_KEY: ${{ secrets.STATE_CONNECTOR_API_KEY }}
        run: |
          if ! gcloud secrets describe data-gov-key --project "$PROJECT_ID" >/dev/null 2>&1; then
            gcloud secrets create data-gov-key --replication-policy=automatic
          fi
          if ! gcloud secrets describe eia-key --project "$PROJECT_ID" >/dev/null 2>&1; then
            gcloud secrets create eia-key --replication-policy=automatic
          fi
          if ! gcloud secrets describe nasa-firms-key --project "$PROJECT_ID" >/dev/null 2>&1; then
            gcloud secrets create nasa-firms-key --replication-policy=automatic
          fi
          if ! gcloud secrets describe openaq-key --project "$PROJECT_ID" >/dev/null 2>&1; then
            gcloud secrets create openaq-key --replication-policy=automatic
          fi
          if ! gcloud secrets describe openstates-key --project "$PROJECT_ID" >/dev/null 2>&1; then
            gcloud secrets create openstates-key --replication-policy=automatic
          fi
          if ! gcloud secrets describe earthdata-nasa-key --project "$PROJECT_ID" >/dev/null 2>&1; then
            gcloud secrets create earthdata-nasa-key --replication-policy=automatic
          fi
          if ! gcloud secrets describe opensky-clientid --project "$PROJECT_ID" >/dev/null 2>&1; then
            gcloud secrets create opensky-clientid --replication-policy=automatic
          fi
          if ! gcloud secrets describe opensky-clientsecret --project "$PROJECT_ID" >/dev/null 2>&1; then
            gcloud secrets create opensky-clientsecret --replication-policy=automatic
          fi
          if ! gcloud secrets describe samgov-key --project "$PROJECT_ID" >/dev/null 2>&1; then
            gcloud secrets create samgov-key --replication-policy=automatic
          fi
          if ! gcloud secrets describe state-connector-key --project "$PROJECT_ID" >/dev/null 2>&1; then
            gcloud secrets create state-connector-key --replication-policy=automatic
          fi
          ensure_secret_version() {
            if gcloud secrets versions access latest --secret "$1" --project "$PROJECT_ID" 2>/dev/null | cmp -s - <(printf '%s' "$2"); then
              echo "Secret $1 unchanged; preserving latest version."
            else
              printf '%s' "$2" | gcloud secrets versions add "$1" --data-file=-
            fi
          }
          if [ -n "$DATA_GOV" ]; then ensure_secret_version data-gov-key "$DATA_GOV"; fi
          if [ -n "$EIA" ]; then ensure_secret_version eia-key "$EIA"; fi
          if [ -n "$NASA_FIRMS" ]; then ensure_secret_version nasa-firms-key "$NASA_FIRMS"; fi
          if [ -n "$OPEN_AQ" ]; then ensure_secret_version openaq-key "$OPEN_AQ"; fi
          if [ -n "$OPENSTATES" ]; then ensure_secret_version openstates-key "$OPENSTATES"; fi
          if [ -n "$EARTHDATA_NASA" ]; then ensure_secret_version earthdata-nasa-key "$EARTHDATA_NASA"; fi
          if [ -n "$OPENSKY_CLIENTID" ]; then ensure_secret_version opensky-clientid "$OPENSKY_CLIENTID"; fi
          if [ -n "$OPENSKY_CLIENTSECRET" ]; then ensure_secret_version opensky-clientsecret "$OPENSKY_CLIENTSECRET"; fi
          if [ -n "$SAMGOV_API_KEY" ]; then ensure_secret_version samgov-key "$SAMGOV_API_KEY"; fi
          if [ -n "$STATE_CONNECTOR_API_KEY" ]; then ensure_secret_version state-connector-key "$STATE_CONNECTOR_API_KEY"; fi
      - name: Capture deployed revision and secret bindings
        id: current
        run: |
          set -euo pipefail
          DIAG_DIR=/tmp/mcp-diagnostics
          mkdir -p "$DIAG_DIR"
          gcloud run services describe "$SERVICE_NAME" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --format=json > /tmp/mcp-service-before.json

          ROLLBACK_REVISION=$(jq -er -f scripts/cloud-run-serving-revision.jq /tmp/mcp-service-before.json)
          gcloud run revisions describe "$ROLLBACK_REVISION" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --format=json > /tmp/mcp-revision-before.json
          jq -S -c -f scripts/cloud-run-secret-schema.jq \
            /tmp/mcp-revision-before.json > "$DIAG_DIR/secret-bindings-before.json"

          for required_name in \
            DATA_GOV EIA NASA_FIRMS OPEN_AQ EARTHDATA_NASA \
            OPENSKY_CLIENTID OPENSKY_CLIENTSECRET SAMGOV_API_KEY; do
            if ! jq -e --arg name "$required_name" '
              .spec.containers[]?.env[]?
              | select(.name == $name and .valueFrom.secretKeyRef)
            ' /tmp/mcp-revision-before.json >/dev/null; then
              echo "Currently deployed MCP service is missing required secret binding: ${required_name}"
              exit 1
            fi
          done

          printf '%s\n' "$ROLLBACK_REVISION" | tee "$DIAG_DIR/rollback-revision.txt"
          echo "rollback_revision=${ROLLBACK_REVISION}" >> "$GITHUB_OUTPUT"
      - name: Deploy MCP proxy service
        id: deploy
        env:
          SYNC_SECRET_VERSIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_secret_versions }}
        run: |
          set -euo pipefail
          DIAG_DIR=/tmp/mcp-diagnostics
          mkdir -p "$DIAG_DIR"
          REVISION_SUFFIX="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ -z "${STATE_CONNECTOR_BASE_URL}" ]; then
            STATE_CONNECTOR_BASE_URL="https://state-connector-382918878290.us-central1.run.app"
          fi
          if [ -z "${STATE_CONNECTOR_KEY_HEADER}" ]; then
            STATE_CONNECTOR_KEY_HEADER="X-API-Key"
          fi
          for value in \
            "$ALLOWED_ORIGINS" "$ACLED_PROXY" \
            "$STATE_CONNECTOR_BASE_URL" "$STATE_CONNECTOR_KEY_HEADER"; do
            if [[ "$value" == *"|"* || "$value" == *$'\n'* ]]; then
              echo "MCP environment value contains an unsupported deploy delimiter."
              exit 1
            fi
          done
          ENV_UPDATES="^|^ALLOWED_ORIGINS=${ALLOWED_ORIGINS}|ACLED_PROXY=${ACLED_PROXY}|STATE_CONNECTOR_BASE_URL=${STATE_CONNECTOR_BASE_URL}|STATE_CONNECTOR_KEY_HEADER=${STATE_CONNECTOR_KEY_HEADER}"
          SECRET_ARGS=()
          if [ "$SYNC_SECRET_VERSIONS" = "true" ]; then
            SECRET_BINDINGS="DATA_GOV=data-gov-key:latest,EIA=eia-key:latest,NASA_FIRMS=nasa-firms-key:latest,OPEN_AQ=openaq-key:latest,EARTHDATA_NASA=earthdata-nasa-key:latest,OPENSKY_CLIENTID=opensky-clientid:latest,OPENSKY_CLIENTSECRET=opensky-clientsecret:latest,SAMGOV_API_KEY=samgov-key:latest"
            OPENSTATES_VERSION=$(gcloud secrets versions list openstates-key --project "$PROJECT_ID" --filter='state=ENABLED' --limit=1 --format='value(name)' 2>/dev/null || true)
            if [ -n "$OPENSTATES_VERSION" ]; then
              SECRET_BINDINGS="${SECRET_BINDINGS},OPENSTATES=openstates-key:latest"
            else
              echo "OPENSTATES not configured (no enabled versions); deploying MCP proxy without OPENSTATES."
            fi
            STATE_CONNECTOR_VERSION=$(gcloud secrets versions list state-connector-key --project "$PROJECT_ID" --filter='state=ENABLED' --limit=1 --format='value(name)' 2>/dev/null || true)
            if [ -n "$STATE_CONNECTOR_VERSION" ]; then
              SECRET_BINDINGS="${SECRET_BINDINGS},STATE_CONNECTOR_API_KEY=state-connector-key:latest"
            else
              echo "STATE_CONNECTOR_API_KEY not configured; deploying MCP proxy without state connector key."
            fi
            SECRET_ARGS=(--update-secrets "$SECRET_BINDINGS")
          fi
          set +e
          gcloud run deploy "$SERVICE_NAME" \
            --region "$REGION" \
            --source gcp/mcp-proxy \
            --allow-unauthenticated \
            --min-instances 1 \
            --timeout 900 \
            --revision-suffix "$REVISION_SUFFIX" \
            --tag "$REVISION_SUFFIX" \
            --no-traffic \
            "${SECRET_ARGS[@]}" \
            --update-env-vars "$ENV_UPDATES" 2>&1 | tee "$DIAG_DIR/deploy-output.log"
          DEPLOY_EXIT=${PIPESTATUS[0]}
          set -e

          {
            echo "deploy_exit=${DEPLOY_EXIT}"
            if [ "$DEPLOY_EXIT" -eq 0 ]; then
              echo "deploy_succeeded=true"
              echo "candidate_revision=${SERVICE_NAME}-${REVISION_SUFFIX}"
              echo "candidate_tag=${REVISION_SUFFIX}"
            else
              echo "deploy_succeeded=false"
            fi
          } >> "$GITHUB_OUTPUT"
      - name: Verify secret bindings are unchanged
        if: steps.deploy.outputs.deploy_succeeded == 'true'
        env:
          SYNC_SECRET_VERSIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_secret_versions }}
        run: |
          set -euo pipefail
          DIAG_DIR=/tmp/mcp-diagnostics
          CANDIDATE_REVISION=${{ steps.deploy.outputs.candidate_revision }}
          gcloud run revisions describe "$CANDIDATE_REVISION" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --format=json > /tmp/mcp-revision-after.json

          jq -S -c -f scripts/cloud-run-secret-schema.jq \
            /tmp/mcp-revision-after.json > "$DIAG_DIR/secret-bindings-after.json"

          if [ "$SYNC_SECRET_VERSIONS" != "true" ] \
            && ! cmp -s "$DIAG_DIR/secret-bindings-before.json" "$DIAG_DIR/secret-bindings-after.json"; then
            echo "MCP secret bindings changed during deploy."
            diff -u "$DIAG_DIR/secret-bindings-before.json" "$DIAG_DIR/secret-bindings-after.json" || true
            exit 1
          fi
          for required_name in \
            DATA_GOV EIA NASA_FIRMS OPEN_AQ EARTHDATA_NASA \
            OPENSKY_CLIENTID OPENSKY_CLIENTSECRET SAMGOV_API_KEY; do
            if ! jq -e --arg name "$required_name" '
              .spec.containers[]?.env[]?
              | select(.name == $name and .valueFrom.secretKeyRef)
            ' /tmp/mcp-revision-after.json >/dev/null; then
              echo "Candidate MCP revision is missing required secret binding: ${required_name}"
              exit 1
            fi
          done
          printf '%s\n' "$CANDIDATE_REVISION" | tee "$DIAG_DIR/deployed-revision.txt"
          echo "Secret bindings preserved from rollback revision ${{ steps.current.outputs.rollback_revision }}."
      - name: Smoke test isolated MCP candidate
        if: steps.deploy.outputs.deploy_succeeded == 'true'
        run: |
          set -euo pipefail
          CANDIDATE_REVISION=${{ steps.deploy.outputs.candidate_revision }}
          CANDIDATE_TAG=${{ steps.deploy.outputs.candidate_tag }}
          CANDIDATE_URL=$(gcloud run services describe "$SERVICE_NAME" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --format=json \
            | jq -er --arg revision "$CANDIDATE_REVISION" --arg tag "$CANDIDATE_TAG" '
              [.status.traffic[]?
                | select(.revisionName == $revision and .tag == $tag)
                | .url]
              | if length == 1 then .[0] else error("isolated candidate URL not found") end
            ')
          echo "Testing isolated MCP candidate ${CANDIDATE_REVISION}."
          curl -fsS "${CANDIDATE_URL}/health" >/dev/null
          curl -fsS "${CANDIDATE_URL}/.well-known/mcp.json" >/dev/null
          node scripts/verify_mcp_candidate.mjs "${CANDIDATE_URL}/mcp"
          node analysis/monitor/run_core_sentinel.mjs \
            --base https://situation-room-feed-382918878290.us-central1.run.app \
            --mcp "${CANDIDATE_URL}/mcp" \
            --static https://congressionalinsights.github.io/TheSituationRoomAI \
            --allow-alerts
      - name: Promote verified MCP revision
        if: steps.deploy.outputs.deploy_succeeded == 'true'
        run: |
          set -euo pipefail
          CANDIDATE_REVISION=${{ steps.deploy.outputs.candidate_revision }}
          gcloud run services update-traffic "$SERVICE_NAME" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --to-revisions "${CANDIDATE_REVISION}=100"
          SERVING_PERCENT=$(gcloud run services describe "$SERVICE_NAME" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --format=json \
            | jq -er --arg revision "$CANDIDATE_REVISION" \
              '[.status.traffic[]? | select(.revisionName == $revision) | .percent] | add // 0')
          if [ "$SERVING_PERCENT" -ne 100 ]; then
            echo "Verified candidate is not serving 100 percent of MCP traffic."
            exit 1
          fi
      - name: Collect Cloud Build diagnostics
        if: always()
        run: |
          set +e
          DIAG_DIR=/tmp/mcp-diagnostics
          mkdir -p "$DIAG_DIR"

          gcloud builds list \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --sort-by=~createTime \
            --limit=10 \
            --format=json > "$DIAG_DIR/cloudbuild-latest.json" 2>&1

          gcloud builds list \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --sort-by=~createTime \
            --limit=10 \
            --format='table(id,status,createTime,finishTime,logUrl)' > "$DIAG_DIR/cloudbuild-latest.table.txt" 2>&1

          BUILD_ID=$(gcloud builds list --project "$PROJECT_ID" --region "$REGION" --sort-by=~createTime --limit=1 --format='value(id)')
          if [ -n "$BUILD_ID" ]; then
            echo "Latest Cloud Build ID: $BUILD_ID" | tee "$DIAG_DIR/cloudbuild-summary.txt"
            LOG_URL=$(gcloud builds describe "$BUILD_ID" --project "$PROJECT_ID" --region "$REGION" --format='value(logUrl)')
            if [ -n "$LOG_URL" ]; then
              echo "Cloud Build log URL: $LOG_URL" | tee -a "$DIAG_DIR/cloudbuild-summary.txt"
            fi
            gcloud builds describe "$BUILD_ID" --project "$PROJECT_ID" --region "$REGION" --format=json > "$DIAG_DIR/cloudbuild-${BUILD_ID}-describe.json" 2>&1
            BUILD_OUTPUT_B64=$(jq -r '.results.buildStepOutputs[]? | select(length > 0) | .' "$DIAG_DIR/cloudbuild-${BUILD_ID}-describe.json" | head -n 1)
            if [ -n "$BUILD_OUTPUT_B64" ]; then
              echo "$BUILD_OUTPUT_B64" | base64 --decode > "$DIAG_DIR/cloudbuild-${BUILD_ID}-buildstep-output.json" 2>/dev/null
              BUILD_ERROR=$(jq -r '.error.errorMessage // empty' "$DIAG_DIR/cloudbuild-${BUILD_ID}-buildstep-output.json" 2>/dev/null)
              if [ -n "$BUILD_ERROR" ]; then
                echo "Cloud Build decoded error: $BUILD_ERROR" | tee -a "$DIAG_DIR/cloudbuild-summary.txt"
              fi
            fi
            gcloud builds log "$BUILD_ID" --project "$PROJECT_ID" --region "$REGION" > "$DIAG_DIR/cloudbuild-${BUILD_ID}.log" 2>&1
          else
            echo "No Cloud Build ID found from gcloud builds list." | tee "$DIAG_DIR/cloudbuild-summary.txt"
          fi
          set -e
      - name: Upload MCP deploy diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcp-deploy-diagnostics-${{ github.run_id }}
          path: /tmp/mcp-diagnostics
          if-no-files-found: warn
      - name: Fail deploy job when deploy command fails
        if: steps.deploy.outputs.deploy_succeeded != 'true'
        run: |
          echo "Deploy failed. Review the mcp-deploy-diagnostics artifact for Cloud Build IDs and logs."
          exit 1
      - name: Health check MCP proxy
        if: steps.deploy.outputs.deploy_succeeded == 'true'
        run: |
          set -euo pipefail
          SERVICE_URL=$(gcloud run services describe "$SERVICE_NAME" --region "$REGION" --format='value(status.url)')
          echo "MCP proxy URL: ${SERVICE_URL}"
          curl -fsS "${SERVICE_URL}/health" >/dev/null
          curl -fsS "${SERVICE_URL}/.well-known/mcp.json" >/dev/null

name: Deploy ACLED Proxy (GCP)

on:
  workflow_dispatch:
    inputs:
      sync_secret_versions:
        description: Sync configured GitHub secrets into Secret Manager before deploying
        required: false
        default: false
        type: boolean
      expected_sha:
        description: Exact reviewed main commit to deploy
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - gcp/acled-proxy/**
      - .github/workflows/deploy-acled-proxy.yml

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: situationroom-ai-20260112
      REGION: us-central1
      SERVICE_NAME: situation-room-acled
      ALLOWED_ORIGINS: https://congressionalinsights.github.io,http://localhost:5173
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Bind manual release to reviewed main commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
          ACTUAL_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$ACTUAL_REF" = refs/heads/main
          test "${#EXPECTED_SHA}" = 40
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]+$ ]]
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"
          test "$(git rev-parse HEAD)" = "$ACTUAL_SHA"
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Ensure ACLED secrets
        if: github.event_name == 'workflow_dispatch' && inputs.sync_secret_versions
        env:
          ACLED_NAME: ${{ secrets.ACLED_NAME }}
          ACLED_PASS: ${{ secrets.ACLED_PASS }}
        run: |
          if [ -z "$ACLED_NAME" ] || [ -z "$ACLED_PASS" ]; then
            echo "ACLED secrets missing."
            exit 1
          fi
          if ! gcloud secrets describe acled-name --project "$PROJECT_ID" >/dev/null 2>&1; then
            gcloud secrets create acled-name --replication-policy=automatic
          fi
          if ! gcloud secrets describe acled-pass --project "$PROJECT_ID" >/dev/null 2>&1; then
            gcloud secrets create acled-pass --replication-policy=automatic
          fi
          ensure_secret_version() {
            if gcloud secrets versions access latest --secret "$1" --project "$PROJECT_ID" 2>/dev/null | cmp -s - <(printf '%s' "$2"); then
              echo "Secret $1 unchanged; preserving latest version."
            else
              printf '%s' "$2" | gcloud secrets versions add "$1" --data-file=-
            fi
          }
          ensure_secret_version acled-name "$ACLED_NAME"
          ensure_secret_version acled-pass "$ACLED_PASS"
      - name: Deploy ACLED proxy service
        env:
          SYNC_SECRET_VERSIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_secret_versions }}
        run: |
          SECRET_ARGS=()
          if [ "$SYNC_SECRET_VERSIONS" = "true" ]; then
            SECRET_ARGS=(--update-secrets "ACLED_NAME=acled-name:latest,ACLED_PASS=acled-pass:latest")
          fi
          cat > /tmp/sr-acled-env.yaml <<EOF
          ALLOWED_ORIGINS: "${ALLOWED_ORIGINS}"
          EOF
          gcloud run deploy "$SERVICE_NAME" \
            --region "$REGION" \
            --source gcp/acled-proxy \
            --allow-unauthenticated \
            "${SECRET_ARGS[@]}" \
            --env-vars-file /tmp/sr-acled-env.yaml
